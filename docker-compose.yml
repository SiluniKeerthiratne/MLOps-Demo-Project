services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  trainer:
    profiles: ["tools"]
    build:
      context: .
      target: trainer
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  # Same as trainer plus API and dev dependencies; used by `make test` and `make lint`.
  tester:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  mlflow-data:
