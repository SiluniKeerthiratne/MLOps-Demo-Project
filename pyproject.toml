[project]
name = "mlops-demo-project"
version = "0.1.0"
description = "Small reproducible, deployable, observable MLOps demo"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "joblib",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.train.dependencies]
mlflow = "^3.1"
matplotlib = "*"

[tool.poetry.group.api.dependencies]
fastapi = "*"
uvicorn = "*"
pydantic = "*"

[tool.poetry.group.data.dependencies]
dvc = "^3.50"

[tool.poetry.group.dev.dependencies]
pytest = "*"
httpx = "*"
ruff = "*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
